# Copy to secrets.yaml (git-ignored), replace every CHANGE_ME, then: kubectl apply -f secrets.yaml
# Generate strong values with e.g.:  python -c "import secrets; print(secrets.token_urlsafe(32))"
apiVersion: v1
kind: Secret
metadata:
  name: pawme-secrets
  namespace: pawme
type: Opaque
stringData:
  JWT_SECRET: CHANGE_ME_32+_random_chars
  INTERNAL_API_KEY: CHANGE_ME_random
  STAFF_PASSWORD: CHANGE_ME_strong_password
  MYSQL_ROOT_PASSWORD: CHANGE_ME_db_root
  MYSQL_PASSWORD: CHANGE_ME_db_user
  # Must embed MYSQL_PASSWORD (URL-encode special characters)
  DATABASE_URL: mysql+pymysql://pawme:CHANGE_ME_db_user@mysql:3306/pawme
